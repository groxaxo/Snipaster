<svg width="1600" height="560" viewBox="0 0 1600 560" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Snipaster</title>
  <desc id="desc">Press F1, select a screen region, save it, and copy it to the clipboard on Ubuntu.</desc>
  <defs>
    <linearGradient id="bg" x1="90" y1="30" x2="1510" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080B18"/>
      <stop offset="0.48" stop-color="#191348"/>
      <stop offset="1" stop-color="#062638"/>
    </linearGradient>
    <linearGradient id="frame" x1="144" y1="119" x2="650" y2="452" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D3265"/>
      <stop offset="1" stop-color="#11162F"/>
    </linearGradient>
    <linearGradient id="selection" x1="238" y1="211" x2="535" y2="372" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A875FF" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#27D7E7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="745" y1="178" x2="1410" y2="322" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.58" stop-color="#D7CEFF"/>
      <stop offset="1" stop-color="#8DECF3"/>
    </linearGradient>
    <linearGradient id="key" x1="541" y1="343" x2="671" y2="463" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B67BFF"/>
      <stop offset="1" stop-color="#5A31C7"/>
    </linearGradient>
    <radialGradient id="glowPurple" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(440 235) rotate(43) scale(470 370)">
      <stop stop-color="#8A55FF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8A55FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1335 260) rotate(135) scale(410 335)">
      <stop stop-color="#18D6E6" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#18D6E6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#FFFFFF" fill-opacity="0.055"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#03040B" flood-opacity="0.62"/>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
    <filter id="keyShadow" x="-50%" y="-50%" width="200%" height="220%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#03040B" flood-opacity="0.55"/>
    </filter>
    <clipPath id="screenClip">
      <rect x="139" y="113" width="523" height="337" rx="30"/>
    </clipPath>
  </defs>

  <rect width="1600" height="560" rx="36" fill="url(#bg)"/>
  <rect width="1600" height="560" rx="36" fill="url(#dots)"/>
  <rect width="1600" height="560" rx="36" fill="url(#glowPurple)"/>
  <rect width="1600" height="560" rx="36" fill="url(#glowCyan)"/>
  <rect x="1.5" y="1.5" width="1597" height="557" rx="34.5" stroke="#FFFFFF" stroke-opacity="0.11" stroke-width="3"/>

  <g opacity="0.65">
    <path d="M0 98H1600" stroke="#FFFFFF" stroke-opacity="0.05"/>
    <path d="M0 462H1600" stroke="#FFFFFF" stroke-opacity="0.04"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="126" y="100" width="550" height="365" rx="38" fill="#090D20" stroke="#A6B5FF" stroke-opacity="0.22" stroke-width="2"/>
    <rect x="139" y="113" width="523" height="337" rx="30" fill="url(#frame)"/>
  </g>

  <g clip-path="url(#screenClip)">
    <rect x="139" y="113" width="523" height="55" fill="#0C1027"/>
    <circle cx="175" cy="141" r="7" fill="#FF6B85"/>
    <circle cx="199" cy="141" r="7" fill="#FFD166"/>
    <circle cx="223" cy="141" r="7" fill="#4FE1A1"/>
    <rect x="253" y="132" width="206" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.08"/>
    <rect x="474" y="132" width="144" height="18" rx="9" fill="#FFFFFF" fill-opacity="0.045"/>

    <rect x="171" y="192" width="431" height="218" rx="18" fill="#0B1026"/>
    <rect x="193" y="213" width="128" height="14" rx="7" fill="#FFFFFF" fill-opacity="0.13"/>
    <rect x="193" y="241" width="88" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.07"/>
    <rect x="193" y="270" width="165" height="112" rx="14" fill="#FFFFFF" fill-opacity="0.045"/>
    <rect x="376" y="213" width="202" height="26" rx="10" fill="#FFFFFF" fill-opacity="0.065"/>
    <rect x="376" y="254" width="202" height="128" rx="14" fill="#FFFFFF" fill-opacity="0.04"/>

    <rect x="238" y="211" width="297" height="161" rx="12" fill="url(#selection)" stroke="#8DECF3" stroke-width="3" stroke-dasharray="11 9"/>
    <circle cx="238" cy="211" r="6" fill="#FFFFFF"/>
    <circle cx="535" cy="211" r="6" fill="#FFFFFF"/>
    <circle cx="238" cy="372" r="6" fill="#FFFFFF"/>
    <circle cx="535" cy="372" r="6" fill="#FFFFFF"/>

    <g transform="translate(485 320)">
      <path d="M0 0L7.6 50.1L21.8 37.8L34 65L47 58.9L34.7 32.2L53.3 31.8L0 0Z" fill="#FFFFFF" stroke="#0A0D1B" stroke-width="4" stroke-linejoin="round"/>
    </g>
  </g>

  <g filter="url(#softGlow)" opacity="0.5">
    <circle cx="603" cy="404" r="66" fill="#9E61FF"/>
  </g>
  <g filter="url(#keyShadow)">
    <rect x="538" y="346" width="134" height="116" rx="26" fill="#25185A" stroke="#C6A5FF" stroke-opacity="0.62" stroke-width="2"/>
    <rect x="548" y="354" width="114" height="91" rx="20" fill="url(#key)"/>
    <path d="M566 382H612" stroke="#FFFFFF" stroke-opacity="0.37" stroke-width="4" stroke-linecap="round"/>
    <text x="605" y="422" text-anchor="middle" fill="white" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="39" font-weight="800" letter-spacing="-1">F1</text>
  </g>

  <g>
    <text x="744" y="206" fill="#9CA8C9" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="24" font-weight="700" letter-spacing="7">OPEN-SOURCE SCREENSHOT WORKFLOW</text>
    <text x="738" y="314" fill="url(#wordmark)" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="124" font-weight="900" letter-spacing="-7">SNIPASTER</text>
    <text x="744" y="369" fill="#C7CBE0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="31" font-weight="500" letter-spacing="0.5">Press F1. Drag. Paste.</text>

    <g transform="translate(744 406)">
      <rect width="151" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="25" cy="23" r="8" fill="#E95420"/>
      <text x="44" y="30" fill="#EEF0FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Ubuntu</text>
    </g>
    <g transform="translate(911 406)">
      <rect width="162" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="25" cy="23" r="8" fill="#A875FF"/>
      <text x="44" y="30" fill="#EEF0FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Wayland</text>
    </g>
    <g transform="translate(1089 406)">
      <rect width="118" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <circle cx="25" cy="23" r="8" fill="#27D7E7"/>
      <text x="44" y="30" fill="#EEF0FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">X11</text>
    </g>
    <g transform="translate(1223 406)">
      <rect width="214" height="46" rx="23" fill="#FFFFFF" fill-opacity="0.075" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <path d="M20 24.5L25.5 30L34.5 18" stroke="#4FE1A1" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="48" y="30" fill="#EEF0FA" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="20" font-weight="700">Local by design</text>
    </g>
  </g>
</svg>

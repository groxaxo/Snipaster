<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Snipaster capture icon</title>
  <desc id="desc">A bright capture reticle and annotation pen on a dark rounded square.</desc>
  <defs>
    <linearGradient id="background" x1="48" y1="34" x2="462" y2="474" gradientUnits="userSpaceOnUse">
      <stop stop-color="#24165F"/>
      <stop offset="0.52" stop-color="#111936"/>
      <stop offset="1" stop-color="#073B48"/>
    </linearGradient>
    <linearGradient id="accent" x1="111" y1="105" x2="397" y2="407" gradientUnits="userSpaceOnUse">
      <stop stop-color="#79F2FF"/>
      <stop offset="0.48" stop-color="#42C9F5"/>
      <stop offset="1" stop-color="#B46CFF"/>
    </linearGradient>
    <linearGradient id="pen" x1="298" y1="287" x2="429" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF7BA7"/>
      <stop offset="1" stop-color="#FFB86B"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020512" flood-opacity="0.55"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="106" fill="url(#background)" filter="url(#shadow)"/>
  <rect x="41" y="41" width="430" height="430" rx="93" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="2"/>
  <circle cx="256" cy="248" r="139" fill="#091124" fill-opacity="0.72" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g stroke="url(#accent)" stroke-width="25" stroke-linecap="round" filter="url(#glow)">
    <path d="M120 200V141C120 129.402 129.402 120 141 120H200"/>
    <path d="M312 120H371C382.598 120 392 129.402 392 141V200"/>
    <path d="M392 296V355C392 366.598 382.598 376 371 376H312"/>
    <path d="M200 376H141C129.402 376 120 366.598 120 355V296"/>
  </g>

  <circle cx="256" cy="248" r="74" stroke="#7BEFFF" stroke-width="10" stroke-opacity="0.92"/>
  <circle cx="256" cy="248" r="20" fill="#7BEFFF"/>
  <path d="M256 151V206" stroke="#7BEFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M256 290V345" stroke="#7BEFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M159 248H214" stroke="#7BEFFF" stroke-width="9" stroke-linecap="round"/>
  <path d="M298 248H353" stroke="#7BEFFF" stroke-width="9" stroke-linecap="round"/>

  <g transform="rotate(-44 365 365)" filter="url(#shadow)">
    <rect x="339" y="275" width="52" height="146" rx="18" fill="url(#pen)"/>
    <path d="M339 292C339 282.611 346.611 275 356 275H374C383.389 275 391 282.611 391 292V311H339V292Z" fill="#FFF2F7" fill-opacity="0.94"/>
    <path d="M339 421H391L365 458L339 421Z" fill="#FFE1B8"/>
    <path d="M357 446L365 458L373 446H357Z" fill="#25304E"/>
